<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나의 정원 — 습관 트래커</title>
<meta name="theme-color" content="#F4F6F1" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F4F6F1;
    color: #263228;
    font-family: 'Work Sans', sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: #7C9885;
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0;
    line-height: 1.2;
  }
  .sub { color: #5A6355; margin-top: 8px; font-size: 15px; line-height: 1.6; }

  .profile-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin: 20px 0 28px; padding: 10px 14px; background: #FFFFFF;
    border: 1px solid #E5E8DE; border-radius: 12px;
  }
  .profile-bar .who { font-weight: 600; font-size: 14px; }
  .profile-bar .who span {
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    color: #7C9885; font-size: 12px; display: block; margin-top: 2px;
  }
  .profile-bar button {
    background: none; border: none; color: #5B8C5A; cursor: pointer;
    font-size: 13px; font-weight: 600; text-decoration: underline;
    text-underline-offset: 3px;
  }

  .login-card {
    background: #FFFFFF; border: 1px solid #E5E8DE; border-radius: 16px;
    padding: 40px 24px; margin: 20px 0 28px; text-align: center;
  }
  .login-card p { color: #5A6355; font-size: 14px; margin-bottom: 20px; }
  .google-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 24px; border-radius: 999px; border: 1px solid #DCE0D4;
    background: #FFFFFF; cursor: pointer; font-size: 14px; font-weight: 600;
    color: #263228; font-family: inherit;
  }
  .google-btn:hover { border-color: #5B8C5A; }
  .google-btn svg { width: 18px; height: 18px; }

  .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .backup-row {
    display: flex; gap: 12px; margin-bottom: 36px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  .backup-row button {
    background: none; border: none; color: #7C9885; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; padding: 0;
    font-family: inherit; font-size: inherit;
  }
  #habit-input {
    flex: 1; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #DCE0D4; background: #FFFFFF;
    font-size: 14px; font-family: 'Work Sans', sans-serif;
  }
  #habit-input:focus, button:focus-visible {
    outline: 2px solid #5B8C5A; outline-offset: 2px;
  }
  #add-btn {
    padding: 12px 20px; border-radius: 10px; border: none;
    background: #5B8C5A; color: #fff; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .empty {
    text-align: center; padding: 48px 20px;
    border: 1px dashed #DCE0D4; border-radius: 16px; color: #7C9885;
  }
  .empty p:first-child { font-family: 'Fraunces', serif; font-size: 18px; margin-bottom: 6px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff; border: 1px solid #E5E8DE; border-radius: 16px;
    padding: 16px 12px; display: flex; flex-direction: column;
    align-items: center; box-shadow: 0 1px 2px rgba(38,50,40,0.04);
    transition: transform 0.2s ease;
  }
  @media (prefers-reduced-motion: no-preference) {
    .card:hover { transform: translateY(-2px); }
  }
  .card .name { font-weight: 600; font-size: 14px; text-align: center; margin: 4px 0 2px; }
  .card .stats {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: #7C9885; margin-bottom: 10px;
  }
  .check-btn {
    padding: 8px 0; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer; background: transparent;
  }
  .del-btn {
    background: none; border: none; color: #B0785A; font-size: 11px;
    cursor: pointer; opacity: 0.6;
  }
  .error-msg { color: #A67C7C; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow" id="date-label"></p>
      <h1>나의 정원</h1>
      <p class="sub">하루를 체크하면 식물이 자라요. 하루 건너뛰어도 식물은 그대로예요 — 성장은 멈추지 않고, 잠시 쉴 뿐이에요.</p>
    </header>

    <div id="auth-area"></div>
    <div id="app-area" style="display:none;">
      <div class="add-row">
        <input id="habit-input" placeholder="새로운 습관 (예: 물 마시기, 10분 산책)" />
        <button id="add-btn">심기</button>
      </div>

      <div class="backup-row">
        <button id="export-btn" type="button">백업 내려받기</button>
      </div>

      <p id="error-msg" class="error-msg" style="display:none;"></p>
      <div id="content"></div>
    </div>
  </div>

<script>
// ---------- ⚠️ 여기 두 값만 채워주세요 (Supabase 프로젝트 설정에서 복사) ----------
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
// -----------------------------------------------------------------------------

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const PALETTE = ["#5B8C5A", "#C9A66B", "#7C9885", "#B0785A", "#8A9A5B", "#A67C7C"];

let currentUser = null;
let habits = []; // [{ id, name, color, checkins }]

// ---------- date helpers ----------
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function currentStreak(checkins) {
  let streak = 0;
  let cursor = todayStr();
  if (!checkins[cursor]) cursor = addDays(cursor, -1);
  while (checkins[cursor] > 0) {
    streak += 1;
    cursor = addDays(cursor, -1);
  }
  return streak;
}
function totalGrowth(checkins) {
  return Object.values(checkins).reduce((sum, n) => sum + n, 0);
}
function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function showError(msg) {
  const el = document.getElementById("error-msg");
  el.textContent = msg;
  el.style.display = msg ? "" : "none";
}

// ---------- plant visual ----------
function plantSVG(total, accent) {
  const stage = total === 0 ? 0 : total < 7 ? 1 : total < 30 ? 2 : total < 60 ? 3 : 4;
  const stemHeight = Math.min(10 + total * 2.2, 130);
  const leafCount = Math.min(Math.floor(total / 3), 12);
  let leavesSVG = "";
  for (let i = 0; i < leafCount; i++) {
    const t = (i + 1) / (leafCount + 1);
    const y = 148 - t * stemHeight;
    const side = i % 2 === 0 ? 1 : -1;
    const cx = 36 + side * 10;
    leavesSVG += `<ellipse cx="${cx}" cy="${y}" rx="9" ry="4.5" fill="${accent}" opacity="0.75" transform="rotate(${side*30} ${cx} ${y})" />`;
  }
  let body;
  if (stage === 0) {
    body = `<circle cx="36" cy="146" r="3.5" fill="#B08968" />`;
  } else {
    const flower = stage >= 4
      ? `<g transform="translate(36 ${150 - stemHeight})"><circle r="7" fill="#E0A458" /><circle r="3" fill="#F6F3EC" /></g>`
      : "";
    body = `<line x1="36" y1="150" x2="36" y2="${150 - stemHeight}" stroke="${accent}" stroke-width="3" stroke-linecap="round" />${leavesSVG}${flower}`;
  }
  return `<svg width="72" height="160" viewBox="0 0 72 160" aria-hidden="true">
    <ellipse cx="36" cy="152" rx="26" ry="6" fill="#B08968" opacity="0.35" />
    ${body}
  </svg>`;
}

// ---------- auth ----------
function renderAuthArea() {
  const area = document.getElementById("auth-area");
  const appArea = document.getElementById("app-area");

  if (!currentUser) {
    appArea.style.display = "none";
    area.innerHTML = `
      <div class="login-card">
        <p>구글 계정으로 로그인하면 어디서든 내 정원을 이어서 가꿀 수 있어요.</p>
        <button class="google-btn" id="google-login-btn" type="button">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.5 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.5 29.6 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 6.5 29.6 4.5 24 4.5c-7.7 0-14.4 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.6 26.9 36.5 24 36.5c-5.4 0-9.9-3.5-11.5-8.4l-6.6 5.1C9.5 40 16.2 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 2.9-2.9 5.3-5.4 6.9l6.6 5.4c-.4.4 7-5.1 7-16.3 0-1.2-.1-2.4-.3-3.5z"/></svg>
          Google로 계속하기
        </button>
      </div>`;
    document.getElementById("google-login-btn").addEventListener("click", async () => {
      const { error } = await supabaseClient.auth.signInWithOAuth({ provider: "google" });
      if (error) showError("로그인에 실패했어요: " + error.message);
    });
    return;
  }

  appArea.style.display = "";
  area.innerHTML = `
    <div class="profile-bar">
      <div class="who">${escapeHTML(currentUser.email || "내")}님의 정원
        <span>구글 계정에 연결되어 어디서든 이어서 볼 수 있어요</span>
      </div>
      <button id="logout-btn" type="button">로그아웃</button>
    </div>`;
  document.getElementById("logout-btn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
  });
}

// ---------- habit CRUD (Supabase) ----------
async function loadHabits() {
  const { data, error } = await supabaseClient
    .from("habits")
    .select("*")
    .order("created_at", { ascending: true });
  if (error) {
    showError("데이터를 불러오지 못했어요: " + error.message);
    return;
  }
  habits = data.map((row) => ({
    id: row.id,
    name: row.name,
    color: row.color,
    checkins: row.checkins || {},
  }));
  showError("");
  render();
}

async function addHabit() {
  const input = document.getElementById("habit-input");
  const name = input.value.trim();
  if (!name) return;
  const color = PALETTE[habits.length % PALETTE.length];
  input.value = "";
  const { error } = await supabaseClient
    .from("habits")
    .insert({ user_id: currentUser.id, name, color, checkins: {} });
  if (error) { showError("추가하지 못했어요: " + error.message); return; }
  loadHabits();
}

async function setCheckins(id, checkins) {
  const { error } = await supabaseClient.from("habits").update({ checkins }).eq("id", id);
  if (error) { showError("저장하지 못했어요: " + error.message); return; }
  loadHabits();
}

async function removeHabit(id) {
  const { error } = await supabaseClient.from("habits").delete().eq("id", id);
  if (error) { showError("삭제하지 못했어요: " + error.message); return; }
  loadHabits();
}

function exportHabits() {
  const blob = new Blob([JSON.stringify(habits, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `habit-garden-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- render ----------
function render() {
  const content = document.getElementById("content");
  const today = todayStr();

  if (habits.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <p>아직 심은 습관이 없어요</p>
        <p style="font-size:14px;">작게 시작해도 괜찮아요. 하나만 골라 심어보세요.</p>
      </div>`;
    return;
  }

  content.innerHTML = `<div class="grid">${habits.map(h => {
    const total = totalGrowth(h.checkins);
    const streak = currentStreak(h.checkins);
    const todayCount = h.checkins[today] || 0;
    return `
      <div class="card">
        ${plantSVG(total, h.color)}
        <p class="name">${escapeHTML(h.name)}</p>
        <p class="stats">오늘 ${todayCount}회 · 스트릭 ${streak}일</p>
        <div style="display:flex; gap:6px; width:100%; margin-bottom:6px;">
          <button class="check-btn" data-action="increment" data-id="${h.id}"
            style="flex:1; border:none; background:${h.color}; color:#fff;">
            +1 체크
          </button>
          ${todayCount > 0 ? `
          <button class="check-btn" data-action="decrement" data-id="${h.id}"
            style="flex:0 0 auto; padding-left:14px; padding-right:14px; border:1px solid ${h.color}; background:transparent; color:${h.color};" aria-label="되돌리기">
            −
          </button>` : ""}
        </div>
        <button class="del-btn" data-action="delete" data-id="${h.id}">삭제</button>
      </div>`;
  }).join("")}</div>`;
}

document.getElementById("add-btn").addEventListener("click", addHabit);
document.getElementById("habit-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") addHabit();
});
document.getElementById("export-btn").addEventListener("click", exportHabits);

document.getElementById("content").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const { action, id } = btn.dataset;
  const today = todayStr();
  const h = habits.find(x => x.id === id);
  if (!h) return;
  if (action === "increment") {
    const checkins = { ...h.checkins, [today]: (h.checkins[today] || 0) + 1 };
    setCheckins(id, checkins);
  } else if (action === "decrement") {
    const checkins = { ...h.checkins };
    const cur = (checkins[today] || 0) - 1;
    if (cur <= 0) delete checkins[today];
    else checkins[today] = cur;
    setCheckins(id, checkins);
  } else if (action === "delete") {
    removeHabit(id);
  }
});

document.getElementById("date-label").textContent =
  new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });

// ---------- auth wiring ----------
supabaseClient.auth.onAuthStateChange((_event, session) => {
  currentUser = session ? session.user : null;
  renderAuthArea();
  if (currentUser) loadHabits();
});

supabaseClient.auth.getSession().then(({ data: { session } }) => {
  currentUser = session ? session.user : null;
  renderAuthArea();
  if (currentUser) loadHabits();
});
</script>
</body>
</html>
