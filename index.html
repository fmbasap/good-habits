<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나의 정원 — 습관 트래커</title>
<meta name="theme-color" content="#F4F6F1" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F4F6F1;
    color: #263228;
    font-family: 'Work Sans', sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: #7C9885;
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0;
    line-height: 1.2;
  }
  .sub { color: #5A6355; margin-top: 8px; font-size: 15px; line-height: 1.6; }

  .profile-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin: 20px 0 28px; padding: 10px 14px; background: #FFFFFF;
    border: 1px solid #E5E8DE; border-radius: 12px;
  }
  .profile-bar .who { font-weight: 600; font-size: 14px; }
  .profile-bar .who span {
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    color: #7C9885; font-size: 12px; display: block; margin-top: 2px;
  }
  .profile-bar button {
    background: none; border: none; color: #5B8C5A; cursor: pointer;
    font-size: 13px; font-weight: 600; text-decoration: underline;
    text-underline-offset: 3px;
  }

  .login-card {
    background: #FFFFFF; border: 1px solid #E5E8DE; border-radius: 16px;
    padding: 40px 24px; margin: 20px 0 28px; text-align: center;
  }
  .login-card p { color: #5A6355; font-size: 14px; margin-bottom: 20px; }
  .google-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 24px; border-radius: 999px; border: 1px solid #DCE0D4;
    background: #FFFFFF; cursor: pointer; font-size: 14px; font-weight: 600;
    color: #263228; font-family: inherit;
  }
  .google-btn:hover { border-color: #5B8C5A; }
  .google-btn svg { width: 18px; height: 18px; }

  .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .backup-row {
    display: flex; gap: 12px; margin-bottom: 36px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  .backup-row button {
    background: none; border: none; color: #7C9885; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; padding: 0;
    font-family: inherit; font-size: inherit;
  }
  #habit-input {
    flex: 1; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #DCE0D4; background: #FFFFFF;
    font-size: 14px; font-family: 'Work Sans', sans-serif;
  }
  #habit-input:focus, button:focus-visible {
    outline: 2px solid #5B8C5A; outline-offset: 2px;
  }
  #add-btn {
    padding: 12px 20px; border-radius: 10px; border: none;
    background: #5B8C5A; color: #fff; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .empty {
    text-align: center; padding: 48px 20px;
    border: 1px dashed #DCE0D4; border-radius: 16px; color: #7C9885;
  }
  .empty p:first-child { font-family: 'Fraunces', serif; font-size: 18px; margin-bottom: 6px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff; border: 1px solid #E5E8DE; border-radius: 16px;
    padding: 16px 12px; display: flex; flex-direction: column;
    align-items: center; box-shadow: 0 1px 2px rgba(38,50,40,0.04);
    transition: transform 0.2s ease;
  }
  @media (prefers-reduced-motion: no-preference) {
    .card:hover { transform: translateY(-2px); }
  }
  .card .name { font-weight: 600; font-size: 14px; text-align: center; margin: 4px 0 2px; }
  .card .stats {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: #7C9885; margin-bottom: 10px;
  }
  .check-btn {
    padding: 8px 0; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer; background: transparent;
  }
  .del-btn {
    background: none; border: none; color: #B0785A; font-size: 11px;
    cursor: pointer; opacity: 0.6;
  }
  .error-msg { color: #A67C7C; font-size: 13px; margin-bottom: 16px; }

  .tab-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn {
    padding: 8px 18px; border-radius: 999px; border: 1px solid #DCE0D4;
    background: #FFFFFF; cursor: pointer; font-size: 13px; font-weight: 600;
    color: #7C9885; font-family: 'Work Sans', sans-serif;
  }
  .tab-btn.active { background: #5B8C5A; border-color: #5B8C5A; color: #fff; }

  .leaderboard-list { display: flex; flex-direction: column; gap: 8px; }
  .lb-row {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid #E5E8DE; border-radius: 12px;
    padding: 12px 16px;
  }
  .lb-row.me { border-color: #5B8C5A; background: #F4F8F3; }
  .lb-rank {
    font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px;
    color: #7C9885; width: 28px; text-align: center; flex-shrink: 0;
  }
  .lb-name { flex: 1; font-weight: 600; font-size: 14px; }
  .lb-leaves {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #5B8C5A;
    font-weight: 600;
  }

  .admin-row {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid #E5E8DE; border-radius: 12px;
    padding: 12px 16px; margin-bottom: 8px;
  }
  .admin-name { flex: 1; font-weight: 600; font-size: 14px; }
  .admin-meta {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #7C9885;
  }
  .admin-del-btn {
    padding: 6px 14px; border-radius: 8px; border: 1px solid #B0785A;
    background: transparent; color: #B0785A; font-size: 12px; font-weight: 600;
    cursor: pointer;
  }

  .cal-toggle-btn {
    width: 100%; padding: 6px 0; border-radius: 8px; border: 1px solid #DCE0D4;
    background: transparent; font-size: 12px; font-weight: 600; cursor: pointer;
    margin-bottom: 6px;
  }
  .cal-panel {
    grid-column: 1 / -1; background: #fff; border: 1px solid #E5E8DE;
    border-radius: 16px; padding: 16px; margin-top: 4px;
  }
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
  }
  .cal-habit-name { font-weight: 600; font-size: 14px; }
  .cal-nav-row { display: flex; align-items: center; gap: 10px; }
  .cal-nav {
    background: none; border: 1px solid #DCE0D4; border-radius: 6px;
    width: 26px; height: 26px; cursor: pointer; font-size: 14px; color: #5B8C5A;
  }
  .cal-title {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #263228;
    min-width: 80px; text-align: center;
  }
  .cal-weekdays, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .cal-weekdays {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7C9885;
    text-align: center; margin-bottom: 4px;
  }
  .cal-cell {
    aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center;
    justify-content: center; font-size: 11px; border: 1px solid #E5E8DE;
  }
  .cal-cell.empty { border: none; }
  .cal-cell.cal-today { outline: 2px solid #5B8C5A; outline-offset: -1px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow" id="date-label"></p>
      <h1>나의 정원</h1>
      <p class="sub">하루를 체크하면 식물이 자라요. 하루 건너뛰어도 식물은 그대로예요 — 성장은 멈추지 않고, 잠시 쉴 뿐이에요.</p>
    </header>

    <div id="auth-area"></div>
    <div id="app-area" style="display:none;">
      <div class="tab-row">
        <button class="tab-btn active" id="tab-garden" type="button">내 정원</button>
        <button class="tab-btn" id="tab-leaderboard" type="button">랭킹보드</button>
        <button class="tab-btn" id="tab-admin" type="button" style="display:none;">관리자</button>
      </div>

      <div id="garden-view">
        <div class="add-row">
          <input id="habit-input" placeholder="새로운 습관 (예: 물 마시기, 10분 산책)" />
          <button id="add-btn">심기</button>
        </div>

        <div class="backup-row">
          <button id="export-btn" type="button">백업 내려받기</button>
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; margin-left:4px;">
            <input type="checkbox" id="hide-leaderboard-toggle" style="cursor:pointer;" />
            랭킹보드에서 내 이름 숨기기
          </label>
        </div>

        <p id="error-msg" class="error-msg" style="display:none;"></p>
        <div id="content"></div>
      </div>

      <div id="leaderboard-view" style="display:none;">
        <div id="leaderboard-content"></div>
      </div>

      <div id="admin-view" style="display:none;">
        <div id="admin-content"></div>
      </div>
    </div>
  </div>

<script>
// ---------- ⚠️ 여기 두 값만 채워주세요 (Supabase 프로젝트 설정에서 복사) ----------
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
// -----------------------------------------------------------------------------

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const PALETTE = ["#5B8C5A", "#C9A66B", "#7C9885", "#B0785A", "#8A9A5B", "#A67C7C"];

let currentUser = null;
let habits = []; // [{ id, name, color, checkins }]

// ---------- date helpers ----------
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function currentStreak(checkins) {
  let streak = 0;
  let cursor = todayStr();
  if (!checkins[cursor]) cursor = addDays(cursor, -1);
  while (checkins[cursor] > 0) {
    streak += 1;
    cursor = addDays(cursor, -1);
  }
  return streak;
}
function totalGrowth(checkins) {
  return Object.values(checkins).reduce((sum, n) => sum + n, 0);
}
function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function showError(msg) {
  const el = document.getElementById("error-msg");
  el.textContent = msg;
  el.style.display = msg ? "" : "none";
}

// ---------- plant visual ----------
function shadeColor(hex, percent) {
  const num = parseInt(hex.replace("#", ""), 16);
  let r = (num >> 16) + Math.round(2.55 * percent);
  let g = ((num >> 8) & 0x00ff) + Math.round(2.55 * percent);
  let b = (num & 0x0000ff) + Math.round(2.55 * percent);
  r = Math.max(Math.min(255, r), 0);
  g = Math.max(Math.min(255, g), 0);
  b = Math.max(Math.min(255, b), 0);
  return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}

function sparkleShape(size, fill, opacity, stroke, strokeWidth) {
  const s = `M 0 ${-size} C ${size * 0.28} ${-size * 0.28} ${size * 0.28} ${-size * 0.28} ${size} 0 C ${size * 0.28} ${size * 0.28} ${size * 0.28} ${size * 0.28} 0 ${size} C ${-size * 0.28} ${size * 0.28} ${-size * 0.28} ${size * 0.28} ${-size} 0 C ${-size * 0.28} ${-size * 0.28} ${-size * 0.28} ${-size * 0.28} 0 ${-size} Z`;
  const strokeAttr = stroke ? `stroke="${stroke}" stroke-width="${strokeWidth || 0.4}"` : "";
  return `<path d="${s}" fill="${fill}" opacity="${opacity || 1}" ${strokeAttr} />`;
}

function blobPath(cx, cy, baseR, points, seed) {
  const pts = [];
  for (let i = 0; i < points; i++) {
    const angle = (i / points) * Math.PI * 2;
    const noise = 0.76 + (Math.sin(seed + i * 2.4) * 0.5 + 0.5) * 0.44;
    const r = baseR * noise;
    pts.push([cx + Math.cos(angle) * r, cy + Math.sin(angle) * r * 0.62]);
  }
  let d = `M ${(pts[0][0] + pts[points - 1][0]) / 2} ${(pts[0][1] + pts[points - 1][1]) / 2} `;
  for (let i = 0; i < points; i++) {
    const next = pts[(i + 1) % points];
    const midX = (pts[i][0] + next[0]) / 2;
    const midY = (pts[i][1] + next[1]) / 2;
    d += `Q ${pts[i][0]} ${pts[i][1]} ${midX} ${midY} `;
  }
  return d + "Z";
}

function leafShape(leafNumber, cx, cy, rotate, accent, uid) {
  const isMilestone = leafNumber % 10 === 0;
  const isFancy = !isMilestone && leafNumber % 5 === 0;

  if (isMilestone) {
    const petals = [0, 72, 144, 216, 288]
      .map((a) => `<ellipse cx="0" cy="-4.5" rx="2.6" ry="4" fill="url(#red-${uid})" transform="rotate(${a})" />`)
      .join("");
    return `<g transform="translate(${cx} ${cy}) rotate(${rotate})" filter="url(#shadow-${uid})">
      ${petals}
      ${sparkleShape(2.1, "#FBE9E4", 1, "#8C3009", 0.4)}
    </g>`;
  }
  if (isFancy) {
    const petals = [0, 72, 144, 216, 288]
      .map((a) => `<ellipse cx="0" cy="-4.5" rx="2.6" ry="4" fill="url(#gold-${uid})" transform="rotate(${a})" />`)
      .join("");
    return `<g transform="translate(${cx} ${cy}) rotate(${rotate})" filter="url(#shadow-${uid})">
      ${petals}
      ${sparkleShape(2.1, "#FFF7E6", 1, "#C98A2E", 0.4)}
    </g>`;
  }
  return `<g transform="translate(${cx} ${cy}) rotate(${rotate})">
    <path d="M 0 -9 C 6 -6 6 5 0 8 C -6 5 -6 -6 0 -9 Z" fill="${accent}" opacity="0.8" />
    <line x1="0" y1="-7" x2="0" y2="6" stroke="${shadeColor(accent, -18)}" stroke-width="0.6" opacity="0.6" />
  </g>`;
}

function getTrunkStyle(leavesEarned, accent) {
  if (leavesEarned >= 650) {
    const count = Math.min(Math.floor((leavesEarned - 650) / 50) + 1, 8);
    return { stops: ["#0D3A52", "#1F7A9E", "#8FE0F5"], glow: true, decoration: "star", starGrad: "red", count };
  }
  if (leavesEarned >= 450) {
    const count = Math.min(Math.floor((leavesEarned - 450) / 50) + 1, 4);
    return { stops: ["#1B5E82", "#4FB8E0", "#BFE9FA"], glow: true, decoration: "star", starGrad: "gold", count };
  }
  if (leavesEarned >= 400) {
    return { stops: ["#1B5E82", "#4FB8E0", "#BFE9FA"], glow: true, decoration: null, count: 0 };
  }
  if (leavesEarned >= 150) {
    const count = Math.min(Math.floor((leavesEarned - 150) / 50) + 1, 4);
    return { stops: ["#7A1E1E", "#C0392B", "#E8776A"], glow: false, decoration: "stripe", count };
  }
  if (leavesEarned >= 100) {
    return { stops: ["#7A1E1E", "#C0392B", "#E8776A"], glow: false, decoration: null, count: 0 };
  }
  if (leavesEarned >= 50) {
    return { stops: ["#B8860B", "#F2C94C", "#FFF3B0"], glow: false, decoration: null, count: 0 };
  }
  return { stops: [shadeColor(accent, -25), accent, shadeColor(accent, 12)], glow: false, decoration: null, count: 0 };
}

function plantSVG(total, accent) {
  const uid = accent.replace("#", "") + "-" + total;
  const leavesEarned = total; // "나뭇잎 개수" — 체크 1개당 나뭇잎 1개
  const trunkStyle = getTrunkStyle(leavesEarned, accent);
  const defs = `<defs>
    <radialGradient id="gold-${uid}" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="55%" stop-color="#E0A458" />
      <stop offset="100%" stop-color="#C98A2E" />
    </radialGradient>
    <radialGradient id="red-${uid}" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FBD9D3" />
      <stop offset="55%" stop-color="#D9552B" />
      <stop offset="100%" stop-color="#8C3009" />
    </radialGradient>
    <linearGradient id="trunk-${uid}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="${trunkStyle.stops[0]}" />
      <stop offset="45%" stop-color="${trunkStyle.stops[1]}" />
      <stop offset="100%" stop-color="${trunkStyle.stops[2]}" />
    </linearGradient>
    <filter id="shadow-${uid}" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#263228" flood-opacity="0.25" />
    </filter>
    <filter id="glow-${uid}" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>`;
  const soil = `<ellipse cx="36" cy="153" rx="27" ry="6" fill="#8C6239" opacity="0.28" />
    <ellipse cx="36" cy="151" rx="24" ry="5" fill="#B08968" opacity="0.4" />`;

  if (leavesEarned === 0) {
    return `<svg width="72" height="160" viewBox="0 0 72 160" aria-hidden="true">
      ${defs}${soil}<path d="M 36 143 C 38.5 144 39.5 147 36 150 C 32.5 147 33.5 144 36 143 Z" fill="#B08968" /></svg>`;
  }

  const thicknessTier = Math.min(Math.floor(leavesEarned / 10), 6);
  const trunkWidth = 6 + thicknessTier * 2;
  const rawTier = Math.floor(leavesEarned / 20);
  const shapeTier = Math.min(rawTier, 2);
  const stemHeight = Math.min(10 + total * 2.2, 130);

  if (shapeTier === 0) {
    const drawCount = leavesEarned;
    let leaves = "";
    for (let i = 0; i < drawCount; i++) {
      const t = (i + 1) / (drawCount + 1);
      const y = 148 - t * stemHeight;
      const side = i % 2 === 0 ? 1 : -1;
      leaves += leafShape(i + 1, 36 + side * 10, y, side * 30, accent, uid);
    }
    return `<svg width="72" height="160" viewBox="0 0 72 160" aria-hidden="true">
      ${defs}${soil}
      <line x1="36" y1="150" x2="36" y2="${150 - stemHeight}" stroke="url(#trunk-${uid})" stroke-width="${trunkWidth}" stroke-linecap="round" />
      ${leaves}
    </svg>`;
  }

  if (shapeTier === 1) {
    const trunkHeight = 66;
    const branchLen = 34;
    const extra = leavesEarned - 20;
    const drawCount = Math.min(extra, 18);
    let leaves = "";
    for (let i = 0; i < drawCount; i++) {
      const left = i % 2 === 0;
      const t = (Math.floor(i / 2) + 1) / (Math.ceil(drawCount / 2) + 1);
      const bx = left ? 36 - 22 * t : 36 + 22 * t;
      const by = 150 - trunkHeight - branchLen * t * 0.7;
      leaves += leafShape(21 + i, bx, by, left ? -25 : 25, accent, uid);
    }
    return `<svg width="72" height="160" viewBox="0 0 72 160" aria-hidden="true">
      ${defs}${soil}
      <line x1="36" y1="150" x2="36" y2="${150 - trunkHeight}" stroke="url(#trunk-${uid})" stroke-width="${trunkWidth}" stroke-linecap="round" />
      <line x1="36" y1="${150 - trunkHeight}" x2="${36 - 22}" y2="${150 - trunkHeight - branchLen * 0.7}" stroke="url(#trunk-${uid})" stroke-width="${trunkWidth * 0.65}" stroke-linecap="round" />
      <line x1="36" y1="${150 - trunkHeight}" x2="${36 + 22}" y2="${150 - trunkHeight - branchLen * 0.7}" stroke="url(#trunk-${uid})" stroke-width="${trunkWidth * 0.65}" stroke-linecap="round" />
      ${leaves}
    </svg>`;
  }

  // shapeTier === 2: elegant, layered tree — keeps getting richer every 20 leaves beyond this
  const luxuryLevel = rawTier - 1;
  const trunkHeight = 58;
  const canopyR = Math.min(20 + luxuryLevel * 3, 34);
  const cy0 = 150 - trunkHeight - 18;
  const drawCount = Math.min(leavesEarned - 40, 20);
  const flourishCount = 1 + Math.min(luxuryLevel, 4);

  let leaves = "";
  for (let i = 0; i < Math.max(drawCount, 0); i++) {
    const angle = (i / Math.max(drawCount, 1)) * Math.PI * 2;
    const r = 14 + (i % 3) * 4;
    const cx = 36 + Math.cos(angle) * r;
    const cy = cy0 + Math.sin(angle) * r * 0.55;
    leaves += leafShape(41 + i, cx, cy, (i * 40) % 360, accent, uid);
  }
  let flourishes = "";
  for (let f = 0; f < flourishCount; f++) {
    const fa = (f / flourishCount) * Math.PI * 2;
    const fx = 36 + Math.cos(fa) * (canopyR - 4);
    const fy = cy0 + Math.sin(fa) * (canopyR - 4) * 0.5;
    flourishes += `<g transform="translate(${fx} ${fy})" filter="url(#shadow-${uid})">
      ${sparkleShape(4.2, `url(#gold-${uid})`)}
      ${sparkleShape(1.6, "#FFF7E6")}
    </g>`;
  }
  const baseFlare = trunkWidth * 1.25;
  const midWidth = trunkWidth * 0.85;
  const topWidth = trunkWidth * 0.6;
  const yTop = 150 - trunkHeight;
  const yMid1 = 150 - trunkHeight * 0.15;
  const yMid2 = 150 - trunkHeight * 0.35;
  const yMid3 = 150 - trunkHeight * 0.6;
  const yMid4 = 150 - trunkHeight * 0.8;
  const trunkPath = `M ${36 - baseFlare} 150
    C ${36 - baseFlare} ${yMid1}, ${36 - midWidth} ${yMid1}, ${36 - midWidth} ${yMid2}
    C ${36 - midWidth} ${yMid3}, ${36 - topWidth} ${yMid4}, ${36 - topWidth} ${yTop}
    Q 36 ${yTop - 4} ${36 + topWidth} ${yTop}
    C ${36 + topWidth} ${yMid4}, ${36 + midWidth} ${yMid3}, ${36 + midWidth} ${yMid2}
    C ${36 + midWidth} ${yMid1}, ${36 + baseFlare} ${yMid1}, ${36 + baseFlare} 150
    Z`;
  const barkShading = `
    <path d="M ${36 - midWidth * 0.4} ${yMid1} C ${36 - midWidth * 0.5} ${yMid3}, ${36 - topWidth * 0.5} ${yMid4}, ${36 - topWidth * 0.3} ${yTop + 4}"
      stroke="${shadeColor(trunkStyle.stops[1], -22)}" stroke-width="1" fill="none" opacity="0.35" stroke-linecap="round" />
    <path d="M ${36 + midWidth * 0.3} ${yMid1} C ${36 + midWidth * 0.35} ${yMid3}, ${36 + topWidth * 0.35} ${yMid4}, ${36 + topWidth * 0.2} ${yTop + 4}"
      stroke="${shadeColor(trunkStyle.stops[1], 15)}" stroke-width="0.8" fill="none" opacity="0.3" stroke-linecap="round" />`;

  let trunkDecorations = "";
  if (trunkStyle.decoration === "stripe") {
    for (let s = 0; s < trunkStyle.count; s++) {
      const xOff = (s + 1) / (trunkStyle.count + 1) - 0.5; // -0.5..0.5
      const x = 36 + xOff * midWidth * 1.3;
      trunkDecorations += `<path d="M ${x} ${150 - 6} Q ${x + midWidth * 0.15} ${yMid2} ${x} ${yTop + 5}"
        stroke="#F2C94C" stroke-width="2" fill="none" opacity="0.85" stroke-linecap="round" />`;
    }
  } else if (trunkStyle.decoration === "star") {
    const starGradId = trunkStyle.starGrad === "red" ? `red-${uid}` : `gold-${uid}`;
    for (let s = 0; s < trunkStyle.count; s++) {
      const t = (s + 1) / (trunkStyle.count + 1);
      const sy = 150 - 6 - t * (150 - 6 - (yTop + 6));
      trunkDecorations += `<g transform="translate(36 ${sy})">${sparkleShape(3.4, `url(#${starGradId})`, 1, "#FFF7E6", 0.4)}</g>`;
    }
  }
  const trunkFilter = trunkStyle.glow ? `filter="url(#glow-${uid})"` : "";

  return `<svg width="72" height="160" viewBox="0 0 72 160" aria-hidden="true">
    ${defs}${soil}
    <path d="${trunkPath}" fill="url(#trunk-${uid})" ${trunkFilter} />
    ${barkShading}
    ${trunkDecorations}
    ${leaves}
    ${flourishes}
  </svg>`;
}

// ---------- habit CRUD (Supabase) ----------
async function loadHabits() {
  const { data, error } = await supabaseClient
    .from("habits")
    .select("*")
    .order("created_at", { ascending: true });
  if (error) {
    showError("데이터를 불러오지 못했어요: " + error.message);
    return;
  }
  habits = data.map((row) => ({
    id: row.id,
    name: row.name,
    color: row.color,
    checkins: row.checkins || {},
  }));
  showError("");
  render();
}

async function addHabit() {
  const input = document.getElementById("habit-input");
  const name = input.value.trim();
  if (!name) return;
  const color = PALETTE[habits.length % PALETTE.length];
  input.value = "";
  const { error } = await supabaseClient
    .from("habits")
    .insert({ user_id: currentUser.id, name, color, checkins: {} });
  if (error) { showError("추가하지 못했어요: " + error.message); return; }
  loadHabits();
}

async function setCheckins(id, checkins) {
  const { error } = await supabaseClient.from("habits").update({ checkins }).eq("id", id);
  if (error) { showError("저장하지 못했어요: " + error.message); return; }
  loadHabits();
}

async function removeHabit(id) {
  const { error } = await supabaseClient.from("habits").delete().eq("id", id);
  if (error) { showError("삭제하지 못했어요: " + error.message); return; }
  loadHabits();
}

function exportHabits() {
  const blob = new Blob([JSON.stringify(habits, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `habit-garden-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- leaderboard visibility setting & admin check ----------
let isAdmin = false;

async function loadMyProfileSetting() {
  const { data, error } = await supabaseClient
    .from("profiles")
    .select("hide_from_leaderboard, is_admin")
    .eq("id", currentUser.id)
    .maybeSingle();
  const toggle = document.getElementById("hide-leaderboard-toggle");
  isAdmin = !!(data && data.is_admin);
  document.getElementById("tab-admin").style.display = isAdmin ? "" : "none";
  if (!toggle) return;
  if (error || !data) {
    toggle.checked = false;
    return;
  }
  toggle.checked = !!data.hide_from_leaderboard;
}

async function setHideFromLeaderboard(hide) {
  const { error } = await supabaseClient
    .from("profiles")
    .update({ hide_from_leaderboard: hide })
    .eq("id", currentUser.id);
  if (error) showError("설정을 저장하지 못했어요: " + error.message);
}

// ---------- render ----------
let openCalendarHabitId = null;
let calendarViewYear = new Date().getFullYear();
let calendarViewMonth = new Date().getMonth(); // 0-indexed

function daysInMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}
function firstWeekday(year, month) {
  return new Date(year, month, 1).getDay();
}

function calendarPanelHTML(habit) {
  const year = calendarViewYear;
  const month = calendarViewMonth;
  const totalDays = daysInMonth(year, month);
  const startWeekday = firstWeekday(year, month);
  const today = todayStr();
  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const count = habit.checkins[dateStr] || 0;
    const isToday = dateStr === today;
    const bg = count > 0 ? habit.color : "transparent";
    const opacity = count === 0 ? 1 : Math.min(0.35 + count * 0.22, 1);
    const textColor = count > 0 ? "#fff" : "#263228";
    cells += `<div class="cal-cell${isToday ? " cal-today" : ""}" style="background:${bg}; opacity:${opacity};" title="${dateStr}${count ? " · " + count + "회" : ""}">
      <span style="color:${textColor};">${d}</span>
    </div>`;
  }
  return `
    <div class="cal-panel">
      <div class="cal-header">
        <span class="cal-habit-name">${escapeHTML(habit.name)}</span>
        <div class="cal-nav-row">
          <button class="cal-nav" data-action="cal-nav" data-delta="-1" aria-label="이전 달">‹</button>
          <span class="cal-title">${year}년 ${month + 1}월</span>
          <button class="cal-nav" data-action="cal-nav" data-delta="1" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="cal-weekdays">${["일","월","화","수","목","금","토"].map(d => `<div>${d}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
    </div>`;
}

function render() {
  const content = document.getElementById("content");
  const today = todayStr();

  if (habits.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <p>아직 심은 습관이 없어요</p>
        <p style="font-size:14px;">작게 시작해도 괜찮아요. 하나만 골라 심어보세요.</p>
      </div>`;
    return;
  }

  const openHabit = habits.find(h => h.id === openCalendarHabitId);

  content.innerHTML = `<div class="grid">${habits.map(h => {
    const total = totalGrowth(h.checkins);
    const streak = currentStreak(h.checkins);
    const todayCount = h.checkins[today] || 0;
    const isOpen = h.id === openCalendarHabitId;
    return `
      <div class="card">
        ${plantSVG(total, h.color)}
        <p class="name">${escapeHTML(h.name)}</p>
        <p class="stats">오늘 ${todayCount}회 · 스트릭 ${streak}일</p>
        <div style="display:flex; gap:6px; width:100%; margin-bottom:6px;">
          <button class="check-btn" data-action="increment" data-id="${h.id}"
            style="flex:1; border:none; background:${h.color}; color:#fff;">
            +1 체크
          </button>
          ${todayCount > 0 ? `
          <button class="check-btn" data-action="decrement" data-id="${h.id}"
            style="flex:0 0 auto; padding-left:14px; padding-right:14px; border:1px solid ${h.color}; background:transparent; color:${h.color};" aria-label="되돌리기">
            −
          </button>` : ""}
        </div>
        <button class="cal-toggle-btn" data-action="toggle-cal" data-id="${h.id}"
          style="border-color:${h.color}; color:${isOpen ? "#fff" : h.color}; background:${isOpen ? h.color : "transparent"};">
          📅 달력${isOpen ? " 닫기" : " 보기"}
        </button>
        <button class="del-btn" data-action="delete" data-id="${h.id}">삭제</button>
      </div>`;
  }).join("")}</div>
  ${openHabit ? calendarPanelHTML(openHabit) : ""}`;
}

// ---------- leaderboard ----------
async function loadLeaderboard() {
  const el = document.getElementById("leaderboard-content");
  el.innerHTML = `<p style="color:#7C9885;">불러오는 중…</p>`;
  const { data, error } = await supabaseClient
    .from("leaderboard")
    .select("*")
    .order("total_leaves", { ascending: false })
    .limit(50);
  if (error) {
    el.innerHTML = `<p class="error-msg">랭킹을 불러오지 못했어요: ${escapeHTML(error.message)}</p>`;
    return;
  }
  if (!data || data.length === 0) {
    el.innerHTML = `<p style="color:#7C9885;">아직 랭킹에 표시할 데이터가 없어요.</p>`;
    return;
  }
  const medals = ["🥇", "🥈", "🥉"];
  el.innerHTML = `<div class="leaderboard-list">${data.map((row, i) => {
    const isMe = currentUser && row.user_id === currentUser.id;
    return `
      <div class="lb-row ${isMe ? "me" : ""}">
        <div class="lb-rank">${medals[i] || i + 1}</div>
        <div class="lb-name">${escapeHTML(row.display_name)}${isMe ? " (나)" : ""}</div>
        <div class="lb-leaves">🌿 ${row.total_leaves}</div>
      </div>`;
  }).join("")}</div>`;
}

function switchTab(tab) {
  const gardenBtn = document.getElementById("tab-garden");
  const lbBtn = document.getElementById("tab-leaderboard");
  const adminBtn = document.getElementById("tab-admin");
  const gardenView = document.getElementById("garden-view");
  const lbView = document.getElementById("leaderboard-view");
  const adminView = document.getElementById("admin-view");
  gardenBtn.classList.toggle("active", tab === "garden");
  lbBtn.classList.toggle("active", tab === "leaderboard");
  adminBtn.classList.toggle("active", tab === "admin");
  gardenView.style.display = tab === "garden" ? "" : "none";
  lbView.style.display = tab === "leaderboard" ? "" : "none";
  adminView.style.display = tab === "admin" ? "" : "none";
  if (tab === "leaderboard") loadLeaderboard();
  if (tab === "admin") loadAdminList();
}

// ---------- admin panel ----------
async function loadAdminList() {
  const el = document.getElementById("admin-content");
  el.innerHTML = `<p style="color:#7C9885;">불러오는 중…</p>`;
  const { data, error } = await supabaseClient.rpc("admin_user_list");
  if (error) {
    el.innerHTML = `<p class="error-msg">목록을 불러오지 못했어요: ${escapeHTML(error.message)}</p>`;
    return;
  }
  if (!data || data.length === 0) {
    el.innerHTML = `<p style="color:#7C9885;">사용자가 없어요.</p>`;
    return;
  }
  el.innerHTML = data.map((row) => `
    <div class="admin-row">
      <div class="admin-name">${escapeHTML(row.display_name)}${row.hide_from_leaderboard ? " 🙈" : ""}</div>
      <div class="admin-meta">🌿 ${row.total_leaves}</div>
      <button class="admin-del-btn" data-uid="${row.user_id}" data-name="${escapeHTML(row.display_name)}">습관 데이터 삭제</button>
    </div>`).join("");
}

async function adminDeleteUserData(userId, displayName) {
  const confirmed = window.confirm(`${displayName}님의 모든 습관/정원 데이터를 삭제하고 랭킹보드에서도 제외할까요? 이 작업은 되돌릴 수 없어요.`);
  if (!confirmed) return;
  const { error: habitsError } = await supabaseClient.from("habits").delete().eq("user_id", userId);
  if (habitsError) {
    alert("데이터를 삭제하지 못했어요: " + habitsError.message);
    return;
  }
  const { error: profileError } = await supabaseClient
    .from("profiles")
    .update({ hide_from_leaderboard: true })
    .eq("id", userId);
  if (profileError) {
    alert("데이터는 삭제됐지만 랭킹보드 제외에는 실패했어요: " + profileError.message);
  }
  loadAdminList();
}

document.getElementById("admin-content").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-uid]");
  if (!btn) return;
  adminDeleteUserData(btn.dataset.uid, btn.dataset.name);
});

document.getElementById("tab-garden").addEventListener("click", () => switchTab("garden"));
document.getElementById("tab-leaderboard").addEventListener("click", () => switchTab("leaderboard"));
document.getElementById("tab-admin").addEventListener("click", () => switchTab("admin"));

document.getElementById("add-btn").addEventListener("click", addHabit);
document.getElementById("habit-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") addHabit();
});
document.getElementById("export-btn").addEventListener("click", exportHabits);
document.getElementById("hide-leaderboard-toggle").addEventListener("change", (e) => {
  setHideFromLeaderboard(e.target.checked);
});

document.getElementById("content").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const { action, id } = btn.dataset;

  if (action === "toggle-cal") {
    if (openCalendarHabitId === id) {
      openCalendarHabitId = null;
    } else {
      openCalendarHabitId = id;
      const now = new Date();
      calendarViewYear = now.getFullYear();
      calendarViewMonth = now.getMonth();
    }
    render();
    return;
  }
  if (action === "cal-nav") {
    const delta = parseInt(btn.dataset.delta, 10);
    calendarViewMonth += delta;
    if (calendarViewMonth < 0) { calendarViewMonth = 11; calendarViewYear -= 1; }
    if (calendarViewMonth > 11) { calendarViewMonth = 0; calendarViewYear += 1; }
    render();
    return;
  }

  const today = todayStr();
  const h = habits.find(x => x.id === id);
  if (!h) return;
  if (action === "increment") {
    const checkins = { ...h.checkins, [today]: (h.checkins[today] || 0) + 1 };
    setCheckins(id, checkins);
  } else if (action === "decrement") {
    const checkins = { ...h.checkins };
    const cur = (checkins[today] || 0) - 1;
    if (cur <= 0) delete checkins[today];
    else checkins[today] = cur;
    setCheckins(id, checkins);
  } else if (action === "delete") {
    if (openCalendarHabitId === id) openCalendarHabitId = null;
    removeHabit(id);
  }
});

document.getElementById("date-label").textContent =
  new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });

// ---------- auth wiring ----------
supabaseClient.auth.onAuthStateChange((_event, session) => {
  currentUser = session ? session.user : null;
  renderAuthArea();
  if (currentUser) {
    loadHabits();
    loadMyProfileSetting();
  }
});

supabaseClient.auth.getSession().then(({ data: { session } }) => {
  currentUser = session ? session.user : null;
  renderAuthArea();
  if (currentUser) {
    loadHabits();
    loadMyProfileSetting();
  }
});
</script>
